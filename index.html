<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdeee4">
<title>С днём рождения, Владочек ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========== ==============================================================
   ТЕМЫ И ПЕРЕМЕННЫЕ
   warm  — тёплый «открыточный» стиль (экраны 1–9, 13–15)
   term  — «терминальный» стиль (экраны 10–12 + состояние ошибки на 9)
   ========================================================================= */
:root{
  --warm-bg1:#fdeee4; --warm-bg2:#fbe1ea; --warm-bg3:#fff6ec;
  --warm-ink:#4a3733; --warm-ink-soft:#8a7068;
  --warm-accent:#e2705c; --warm-accent-dark:#c85543; --warm-accent-soft:#f6b6a5;
  --card:#fffaf5;
  --term-bg:#080d0a; --term-ink:#4bf08a; --term-dim:#2b7a4c; --term-red:#ff5b52;
  --radius:22px;
  --shadow:0 10px 24px rgba(120,70,60,.14), 0 2px 6px rgba(120,70,60,.10);
  --font-head:'Comfortaa', 'Trebuchet MS', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg:radial-gradient(120% 80% at 50% 0%, var(--warm-bg3) 0%, var(--warm-bg1) 45%, var(--warm-bg2) 100%);
  --ink:var(--warm-ink); --ink-soft:var(--warm-ink-soft); --accent:var(--warm-accent);
}
body[data-theme="term"]{
  --bg:radial-gradient(120% 90% at 50% 0%, #10241a 0%, #0a1410 40%, var(--term-bg) 100%);
  --ink:var(--term-ink); --ink-soft:var(--term-dim); --accent:var(--term-ink);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg);
  transition:background 700ms ease, color 500ms ease;
  overflow:hidden;
  overscroll-behavior:none;
}
body[data-theme="term"]{font-family:var(--font-mono)}

/* ---------- Прогресс-бар сверху ---------- */
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(74,55,51,.10);z-index:60}
body[data-theme="term"] .progress{background:rgba(75,240,138,.15)}
.progress__fill{
  height:100%;width:6.66%;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--warm-accent-soft),var(--warm-accent));
  transition:width 450ms cubic-bezier(.4,0,.2,1), background 700ms ease;
  box-shadow:0 0 8px rgba(226,112,92,.5);
}
body[data-theme="term"] .progress__fill{
  background:linear-gradient(90deg,var(--term-dim),var(--term-ink));
  box-shadow:0 0 10px rgba(75,240,138,.6);
}

/* ---------- Каркас экранов ---------- */
#app{position:relative;height:100dvh;height:100vh;height:100dvh;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.screen.active{display:flex;animation:screenIn 420ms cubic-bezier(.22,.9,.3,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.screen__body{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;width:100%;max-width:520px;margin:0 auto;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;
}
.screen__body::-webkit-scrollbar{display:none}
.screen__foot{flex:none;padding-top:14px;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}

/* ---------- Типографика ---------- */
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(26px,7.4vw,36px);line-height:1.2;letter-spacing:-.5px}
h2{font-family:var(--font-head);font-weight:700;font-size:clamp(21px,5.6vw,27px);line-height:1.25}
.lead{font-size:clamp(15px,4vw,17px);color:var(--ink-soft);line-height:1.5;max-width:26em}
.tiny{font-size:12.5px;color:var(--ink-soft);opacity:.85;line-height:1.45}
.em{font-style:italic}
body[data-theme="term"] h1,body[data-theme="term"] h2{font-family:var(--font-mono);letter-spacing:0}

/* ---------- Кнопки ---------- */
.btn{
  font-family:var(--font-head);font-weight:700;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#ef8067,var(--warm-accent) 60%,var(--warm-accent-dark));
  border:none;border-radius:100px;padding:16px 26px;width:100%;cursor:pointer;
  box-shadow:0 6px 0 #b84a3a,0 12px 22px rgba(200,85,67,.32);
  transition:transform 120ms ease, box-shadow 120ms ease, opacity 200ms ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b84a3a,0 6px 12px rgba(200,85,67,.28)}
.btn--ghost{
  background:var(--card);color:var(--warm-accent-dark);
  box-shadow:0 4px 0 rgba(226,112,92,.28),0 8px 16px rgba(180,100,90,.14);
}
.btn--sm{font-size:15px;padding:12px 20px;width:auto;align-self:center}
.btn[hidden]{display:none}
body[data-theme="term"] .btn{
  font-family:var(--font-mono);font-weight:700;text-align:left;color:var(--term-ink);
  background:transparent;border:1px solid var(--term-dim);border-radius:8px;
  box-shadow:0 0 0 rgba(0,0,0,0), inset 0 0 24px rgba(75,240,138,.06);
}
body[data-theme="term"] .btn:active{transform:translateY(2px);background:rgba(75,240,138,.10)}

/* ---------- Карточки ---------- */
.card{
  background:var(--card);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);
  width:100%;
}

/* =========================================================================
   ЭКРАН 1 — Привет
   ========================================================================= */
.hi-emoji{font-size:64px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.dodge{position:relative;width:100%;height:150px;margin-top:4px}
.dodge .btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:auto;white-space:nowrap;transition:left 260ms cubic-bezier(.3,1.4,.5,1),top 260ms cubic-bezier(.3,1.4,.5,1),transform 120ms ease}
.dodge .btn:active{transform:translate(-50%,-50%) translateY(4px)}
.dodge__msg{position:absolute;left:0;right:0;bottom:2px;font-size:14px;color:var(--warm-accent-dark);font-weight:700;opacity:0;transition:opacity 300ms ease}
.dodge__msg.show{opacity:1}

/* =========================================================================
   ЭКРАН 2 — Капча
   ========================================================================= */
.q-card{width:100%;text-align:left}
.q-num{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.q-text{font-family:var(--font-head);font-weight:600;font-size:19px;line-height:1.35;margin:8px 0 14px}
.field{display:flex;gap:8px}
.field input{
  flex:1;min-width:0;font-family:var(--font-body);font-size:16px;color:var(--warm-ink);
  padding:13px 15px;border:2px solid rgba(226,112,92,.28);border-radius:14px;background:#fff;outline:none;
  transition:border-color 180ms ease, box-shadow 180ms ease;
}
.field input:focus{border-color:var(--warm-accent);box-shadow:0 0 0 4px rgba(226,112,92,.14)}
.field button{
  flex:none;border:none;border-radius:14px;padding:0 18px;cursor:pointer;color:#fff;font-size:18px;
  background:linear-gradient(180deg,#ef8067,var(--warm-accent-dark));
}
.field.shake{animation:shake 420ms cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.q-note{margin-top:10px;font-size:14.5px;min-height:20px;font-weight:600}
.q-note.bad{color:var(--warm-accent-dark)}
.q-note.good{color:#2f9e63}
.q-dots{display:flex;gap:7px;justify-content:center;margin-top:2px}
.q-dots i{width:8px;height:8px;border-radius:50%;background:rgba(226,112,92,.25);transition:background 300ms ease,transform 300ms ease}
.q-dots i.on{background:#2f9e63;transform:scale(1.25)}
.stamp{
  font-family:var(--font-head);font-weight:700;font-size:clamp(20px,5.6vw,26px);letter-spacing:1px;
  color:#2f9e63;border:4px double #2f9e63;border-radius:14px;padding:14px 18px;line-height:1.2;
  animation:stampIn 620ms cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stampIn{0%{opacity:0;transform:rotate(-24deg) scale(2.6)}60%{opacity:1;transform:rotate(-6deg) scale(.92)}100%{opacity:1;transform:rotate(-5deg) scale(1)}}

/* =========================================================================
   ЭКРАН 3 — Загрузка
   ========================================================================= */
.load-wrap{width:100%;max-width:360px}
.load-bar{height:14px;border-radius:99px;background:rgba(226,112,92,.16);overflow:hidden;box-shadow:inset 0 2px 4px rgba(150,80,70,.12)}
.load-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--warm-accent-soft),var(--warm-accent))}
.load-pct{font-family:var(--font-head);font-weight:700;font-size:40px;margin-bottom:10px}
.load-txt{margin-top:14px;font-size:16px;color:var(--ink-soft);min-height:24px}

/* =========================================================================
   ЭКРАН 4 — Цветы
   ========================================================================= */
.flower-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.flower{position:absolute;font-size:32px;will-change:transform,opacity;user-select:none}
#s4 .screen__body,#s4 .screen__foot{position:relative;z-index:2}
.counter-pill{
  display:inline-block;background:var(--card);border-radius:99px;padding:10px 18px;box-shadow:var(--shadow);
  font-family:var(--font-head);font-weight:700;font-size:16px;
}
.counter-pill b{color:var(--warm-accent-dark);font-variant-numeric:tabular-nums}
.tap-hint{font-size:14px;color:var(--ink-soft);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* =========================================================================
   ЭКРАН 5 — Торт
   ========================================================================= */
.cake{position:relative;width:250px;margin:0 auto;filter:drop-shadow(0 12px 18px rgba(150,90,80,.22))}
/* ширина контейнера подобрана так, чтобы 27 свечей встали ровно 3 рядами по 9 */
.candles{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:0 4px;width:158px;margin:0 auto -2px}
.candle{position:relative;width:14px;height:32px;margin-bottom:-4px;display:flex;justify-content:center;align-items:flex-end;cursor:pointer;flex:none}
.candle .stick{width:6px;height:24px;border-radius:3px 3px 1px 1px;background:repeating-linear-gradient(45deg,#fff 0 3px,#f4a0b4 3px 6px);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.candle .flame{
  position:absolute;top:0;left:50%;width:9px;height:13px;margin-left:-4.5px;border-radius:50% 50% 45% 45%;
  background:radial-gradient(circle at 50% 75%,#fff6b0 0 20%,#ffc93c 45%,#ff8a2b 75%,rgba(255,110,20,0) 100%);
  box-shadow:0 0 12px 3px rgba(255,180,60,.55);transform-origin:50% 100%;
  animation:flicker 700ms ease-in-out infinite alternate;
}
@keyframes flicker{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.16,1.24) rotate(5deg)}}
.candle.out .flame{animation:none;opacity:0;transform:scale(.2)}
.candle .smoke{position:absolute;top:-2px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:rgba(160,150,150,.55);opacity:0}
.candle.out .smoke{animation:smoke 1.1s ease-out forwards}
@keyframes smoke{0%{opacity:.65;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-34px) scale(2.2)}}
.cake__top{position:relative;z-index:3;height:34px;border-radius:16px 16px 8px 8px;background:linear-gradient(180deg,#fff3f6,#ffd9e4);box-shadow:inset 0 -6px 0 rgba(226,112,92,.10)}
.cake__drip{position:absolute;left:2px;right:2px;top:22px;height:22px;display:flex;justify-content:space-around;align-items:flex-start}
.cake__drip span{width:22px;border-radius:0 0 11px 11px;background:linear-gradient(180deg,#f5a08d,#e2705c)}
.cake__mid{position:relative;z-index:2;height:44px;margin:0 -8px;border-radius:10px;background:linear-gradient(180deg,#c98a63,#a96f4c);box-shadow:inset 0 6px 0 rgba(255,255,255,.14)}
.cake__bot{position:relative;z-index:1;height:52px;margin:0 -16px;border-radius:10px 10px 14px 14px;background:linear-gradient(180deg,#d99a72,#b57a55);box-shadow:inset 0 6px 0 rgba(255,255,255,.12)}
.cake__plate{position:relative;z-index:0;height:12px;margin:0 -34px;border-radius:0 0 40px 40px;background:linear-gradient(180deg,#f2e4dc,#d9c6bd)}
.wish{font-family:var(--font-head);font-weight:600;font-size:16px;color:var(--warm-accent-dark);line-height:1.4;opacity:0;transition:opacity 500ms ease}
.wish.show{opacity:1}

/* =========================================================================
   ЭКРАН 6 — Статистика
   ========================================================================= */
.stat{width:100%;opacity:0;transform:translateY(14px);transition:opacity 500ms ease,transform 500ms ease;text-align:left}
.stat.show{opacity:1;transform:none}
.stat__label{font-size:14.5px;color:var(--ink-soft);line-height:1.35}
.stat__value{font-family:var(--font-head);font-weight:700;font-size:clamp(30px,9vw,42px);color:var(--warm-accent-dark);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.stat__extra{font-size:14px;color:var(--ink-soft);margin-top:4px;opacity:0;transition:opacity 600ms ease}
.stat__extra.show{opacity:1}

/* =========================================================================
   ЭКРАН 7 — Комплименты
   ========================================================================= */
.compliment{
  width:100%;min-height:150px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:600;font-size:clamp(17px,4.8vw,20px);line-height:1.45;
  white-space:pre-line;
}
.compliment--last{color:var(--warm-accent-dark)}
.compliment.fade{animation:cFade 420ms ease both}
@keyframes cFade{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}

/* =========================================================================
   ЭКРАН 8 — Диплом
   ========================================================================= */
.paper{
  position:relative;width:100%;background:
    repeating-linear-gradient(0deg,rgba(160,120,90,.035) 0 2px,transparent 2px 4px),
    linear-gradient(160deg,#fffaf0,#f9edd9);
  border-radius:8px;padding:22px 18px;box-shadow:0 14px 30px rgba(120,80,60,.22);
  color:#5a4433;
}
.paper::before{content:"";position:absolute;inset:8px;border:2px solid rgba(190,140,90,.55);border-radius:4px;pointer-events:none}
.paper::after{content:"";position:absolute;inset:13px;border:1px solid rgba(190,140,90,.35);border-radius:3px;pointer-events:none}
.diploma{transform:rotate(-1.4deg)}
.diploma .crest{font-size:34px;line-height:1}
.diploma .stars{letter-spacing:4px;color:#d2a24a;font-size:15px;margin-bottom:2px}
.diploma h2{font-family:var(--font-head);font-size:clamp(19px,5.4vw,24px);letter-spacing:.5px;color:#8a5a2b;margin:6px 0 14px}
.diploma .who{font-family:var(--font-head);font-weight:700;font-size:clamp(18px,5vw,22px);color:#5a4433;margin:4px 0 14px}
.diploma .small{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:#9c7a55}
.diploma .for{font-size:14.5px;line-height:1.6;color:#6b5240;white-space:pre-line}
.diploma .life{margin-top:14px;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;color:#9c7a55}
.applause{font-family:var(--font-head);font-weight:700;font-size:22px;color:var(--warm-accent-dark);opacity:0;transition:opacity 400ms ease}
.applause.show{opacity:1;animation:pop 500ms cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.hands{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.hand{position:absolute;bottom:-50px;font-size:30px}

/* =========================================================================
   ЭКРАН 9 — Коробка
   ========================================================================= */
.gift{position:relative;width:150px;height:140px;margin:0 auto;animation:giftIdle 3s ease-in-out infinite}
@keyframes giftIdle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.gift.shaking{animation:giftShake 1.5s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes giftShake{
  0%{transform:rotate(0) translateX(0)}
  20%{transform:rotate(-6deg) translateX(-4px)}
  40%{transform:rotate(8deg) translateX(6px) scale(1.03)}
  60%{transform:rotate(-11deg) translateX(-9px) scale(1.05)}
  75%{transform:rotate(13deg) translateX(11px) scale(1.07)}
  88%{transform:rotate(-15deg) translateX(-13px) scale(1.08)}
  100%{transform:rotate(0) scale(.9);opacity:.55}
}
.gift__box{position:absolute;left:5px;right:5px;bottom:0;height:98px;border-radius:12px;background:linear-gradient(180deg,#ef8067,#c85543);box-shadow:inset 0 -10px 20px rgba(0,0,0,.12)}
.gift__lid{position:absolute;left:0;right:0;bottom:92px;height:26px;border-radius:10px;background:linear-gradient(180deg,#f79c86,#e2705c);box-shadow:0 4px 8px rgba(150,60,45,.25)}
.gift__ribbon{position:absolute;left:50%;margin-left:-13px;bottom:0;width:26px;height:118px;background:linear-gradient(180deg,#ffe08a,#f6c445);border-radius:3px}
.gift__bow{position:absolute;left:50%;bottom:112px;width:70px;height:34px;margin-left:-35px}
.gift__bow::before,.gift__bow::after{content:"";position:absolute;top:0;width:34px;height:34px;background:linear-gradient(180deg,#ffe08a,#f6c445);border-radius:50% 50% 50% 10%}
.gift__bow::before{left:0;transform:rotate(-16deg)}
.gift__bow::after{right:0;transform:rotate(16deg) scaleX(-1)}
.redflash{position:fixed;inset:0;background:rgba(255,40,30,.55);opacity:0;pointer-events:none;z-index:70}
.redflash.go{animation:flash 1.1s ease-in-out}
@keyframes flash{0%,100%{opacity:0}12%{opacity:.85}24%{opacity:0}42%{opacity:.7}58%{opacity:0}74%{opacity:.55}}
.errbox{
  font-family:var(--font-mono);text-align:left;width:100%;
  border:1px solid var(--term-red);border-radius:10px;padding:16px;color:var(--term-red);
  background:rgba(255,60,50,.07);line-height:1.6;
}
.errbox b{display:block;font-size:19px;letter-spacing:2px;margin-bottom:6px}

/* =========================================================================
   ЭКРАНЫ 10–12 — Терминал
   ========================================================================= */
.term-block{width:100%;text-align:left;font-family:var(--font-mono);font-size:clamp(11.5px,3.3vw,14px);line-height:1.85}
.term-head{color:var(--term-ink);margin-bottom:12px;font-weight:700}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--term-ink)}
.term-line .dots{color:var(--term-dim)}
.term-line.bad{color:var(--term-red)}
.caret::after{content:"▌";animation:blink 1s steps(1) infinite;color:var(--term-ink)}
@keyframes blink{50%{opacity:0}}
.crit{margin-top:16px;color:var(--term-red);white-space:pre-wrap;line-height:1.7;opacity:0;transition:opacity 400ms ease}
.crit.show{opacity:1}

/* Трекинг (экран 11) */
.track{width:100%;text-align:left;font-family:var(--font-mono);font-size:clamp(12px,3.4vw,14px)}
.track li{position:relative;list-style:none;padding:0 0 14px 26px;color:var(--term-dim);opacity:0;transform:translateY(6px);transition:opacity 350ms ease,transform 350ms ease;line-height:1.35}
.track li.show{opacity:1;transform:none}
.track li::before{content:"";position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--term-dim);background:var(--term-bg);z-index:2}
.track li::after{content:"";position:absolute;left:7.5px;top:14px;bottom:0;width:1px;background:var(--term-dim);opacity:.5}
.track li:last-child::after{display:none}
.track li.done{color:var(--term-ink)}
.track li.done::before{background:var(--term-ink);border-color:var(--term-ink);box-shadow:0 0 8px rgba(75,240,138,.7)}
.track li.done .mark{color:var(--term-ink)}
.track li.fail{color:var(--term-red);animation:blinkSoft 1.1s ease-in-out infinite}
.track li.fail::before{background:var(--term-red);border-color:var(--term-red);box-shadow:0 0 10px rgba(255,91,82,.8)}
@keyframes blinkSoft{50%{opacity:.42}}

/* Экран 12 — лягушка */
.frog{font-size:82px;line-height:1;animation:hop 2.4s ease-in-out infinite}
.frog.jump{animation:hopOnce 520ms cubic-bezier(.3,1.5,.4,1)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes hopOnce{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-26px) scale(1.1,.92)}100%{transform:translateY(0) scale(1)}}
.bubble{
  position:relative;background:rgba(75,240,138,.08);border:1px solid var(--term-dim);border-radius:14px;
  padding:16px 18px;font-family:var(--font-mono);line-height:1.65;color:var(--term-ink);width:100%;
}
.bubble::after{content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;width:16px;height:16px;
  background:var(--term-bg);border-left:1px solid var(--term-dim);border-top:1px solid var(--term-dim);transform:rotate(45deg)}
.bubble b{font-size:18px}
.frog-reply{min-height:24px;font-family:var(--font-mono);color:var(--term-ink);font-size:15px}
.frog-btns{display:flex;flex-direction:column;gap:8px;width:100%}

/* =========================================================================
   ЭКРАН 13 — Обратный отсчёт
   ========================================================================= */
.count{display:flex;gap:8px;justify-content:center;width:100%}
.tile{
  flex:1;min-width:0;background:var(--card);border-radius:16px;padding:12px 4px 9px;box-shadow:var(--shadow);
}
.tile b{display:block;font-family:var(--font-head);font-weight:700;font-size:clamp(24px,8.4vw,34px);color:var(--warm-accent-dark);font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}

/* =========================================================================
   ЭКРАН 14 — Сертификат
   ========================================================================= */
.cert{transform:rotate(1.2deg);position:relative;overflow:hidden;padding-bottom:46px}
.cert__title{font-family:var(--font-head);font-weight:700;font-size:clamp(16px,4.6vw,20px);letter-spacing:1px;color:#8a5a2b;text-align:center;margin-bottom:16px;line-height:1.3}
.cert__row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed rgba(160,120,90,.35)}
.cert__row span:first-child{color:#9c7a55;flex:none}
.cert__row span:last-child{font-weight:700;text-align:right;color:#5a4433}
.cert__foot{margin-top:16px;text-align:center;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:#9c7a55}
.seal{
  position:absolute;right:16px;bottom:4px;width:112px;height:112px;border-radius:50%;
  border:3px solid rgba(190,60,80,.5);color:rgba(170,45,65,.62);transform:rotate(-14deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-head);font-weight:700;font-size:9px;letter-spacing:.4px;line-height:1.5;padding:10px;
  box-shadow:inset 0 0 0 3px rgba(190,60,80,.22);opacity:.85;
}
.cert__torn{position:absolute;left:0;right:0;bottom:-1px;height:10px;
  background:repeating-linear-gradient(135deg,#fffaf0 0 7px,transparent 7px 14px)}
.save-note{font-size:13.5px;color:var(--ink-soft);min-height:18px}

/* =========================================================================
   ЭКРАН 15 — Финал
   ========================================================================= */
#finalText{display:flex;flex-direction:column;align-items:center;gap:20px;transition:opacity 550ms ease,transform 550ms ease}
#finalText.gone{opacity:0;transform:translateY(-14px)}
#finalText[hidden]{display:none}
.final-p{font-size:clamp(15.5px,4.3vw,18px);line-height:1.65;opacity:0;transform:translateY(12px);transition:opacity 700ms ease,transform 700ms ease;max-width:24em}
.final-p.show{opacity:1;transform:none}
.final-big{
  font-family:var(--font-head);font-weight:700;font-size:clamp(24px,7.6vw,36px);line-height:1.2;
  color:var(--warm-accent-dark);opacity:0;
}
.final-big.show{opacity:1;animation:bigIn 900ms cubic-bezier(.2,1.5,.4,1) both}
@keyframes bigIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;display:none}
#confetti.on{display:block}

/* Мелкая адаптация под низкие экраны */
/* на совсем узких экранах печать поменьше, чтобы не наезжала на строки */
@media (max-width:360px){
  .seal{width:92px;height:92px;font-size:8px;right:10px;bottom:2px}
  .cert__row{font-size:12.5px}
}
@media (max-height:660px){
  .hi-emoji{font-size:52px}
  .cake__bot{height:42px}.cake__mid{height:36px}
  .frog{font-size:64px}
  .screen__body{gap:12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  [78,  'Убираем лишний пафос…'],

/* =========================================================================
   2. УТИЛИТЫ
   ========================================================================= */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const rand = (a, b) => a + Math.random() * (b - a);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Нормализация ответа: нижний регистр, ё→е, схлопнутые пробелы
function norm(s){
  return String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
}

/* =========================================================================
   3. НАВИГАЦИЯ ПО ЭКРАНАМ
   ========================================================================= */
const screens = [];
for (let i = 1; i <= CONFIG.TOTAL_SCREENS; i++) screens.push($('#s' + i));

const onEnter = {};   // хуки «экран стал активным», вызываются один раз
const entered = {};
let current = 0;

// Экраны 10–12 показываются в «терминальной» теме
const TERM_SCREENS = [10, 11, 12];

function go(n){
  if (n === current || n < 1 || n > CONFIG.TOTAL_SCREENS) return;
  if (current) screens[current - 1].classList.remove('active');
  current = n;
  const el = screens[n - 1];
  el.classList.add('active');
  el.scrollTop = 0;
  $('#progressFill').style.width = (n / CONFIG.TOTAL_SCREENS * 100) + '%';
  document.body.dataset.theme = TERM_SCREENS.includes(n) ? 'term' : 'warm';
  document.querySelector('meta[name=theme-color]')
    .setAttribute('content', TERM_SCREENS.includes(n) ? '#080d0a' : '#fdeee4');
  if (onEnter[n] && !entered[n]) { entered[n] = true; onEnter[n](); }
}

(function screen1(){
  const zone = $('#dodge'), btn = $('#btnNotVlada'), msg = $('#dodgeMsg');
  let dodges = 0;
  const MAX_DODGES = 3;

  function jump(){
    if (dodges >= MAX_DODGES) return;
    dodges++;
    const zr = zone.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    const maxX = Math.max(0, zr.width  - br.width  - 6);
    const maxY = Math.max(0, zr.height - br.height - 22);
    btn.style.transform = 'none';
    btn.style.left = rand(0, maxX) + 'px';
    btn.style.top  = rand(0, maxY) + 'px';
    if (dodges >= MAX_DODGES) zone.classList.add('caught');
  }

  btn.addEventListener('mouseenter', jump);
  btn.addEventListener('touchstart', e => {
    if (dodges < MAX_DODGES) { e.preventDefault(); jump(); }
  }, { passive: false });
  btn.addEventListener('click', () => {
    if (dodges < MAX_DODGES) { jump(); return; }
    // Кнопка поймана: показываем текст и возвращаем её на место
    msg.textContent = T.s1_caught;
    msg.classList.add('show');
    btn.style.left = ''; btn.style.top = '';
    btn.style.transform = '';
  });

  $('#btnItsMe').addEventListener('click', () => go(2));
})();

(function screen2(){
  const dots = $('#qDots');
  QUESTIONS.forEach(() => dots.appendChild(document.createElement('i')));
  const dotEls = $$('i', dots);

  let idx = 0, locked = false;
  const form = $('#qForm'), input = $('#qInput'), note = $('#qNote'), field = form;

  function render(){
    $('#qNum').textContent  = T.s2_qlabel(idx + 1);
    $('#qText').textContent = QUESTIONS[idx].text;
    input.value = '';
    note.textContent = '';
    note.className = 'q-note';
  }
  render();

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (locked) return;
    const q = QUESTIONS[idx];
    const val = input.value;
    if (!val.trim()) return;

    if (q.check(val)){
      locked = true;
      note.textContent = '✓ ' + q.ok;
      note.className = 'q-note good';
      dotEls[idx].classList.add('on');
      input.blur();
      await sleep(1200);
      idx++;
      locked = false;
      if (idx < QUESTIONS.length){
        render();
      } else {
        $('#qCard').hidden = true;
        $('#qDone').hidden = false;
        $('#btnCaptchaNext').hidden = false;
      }
    } else {
      // Неверно: тряска, подсказка, поле НЕ очищается
      note.textContent = q.hint;
      note.className = 'q-note bad';
      field.classList.remove('shake');
      void field.offsetWidth;
      field.classList.add('shake');
    }
  });

  $('#btnCaptchaNext').addEventListener('click', () => go(3));
})();

onEnter[3] = function(){
  const bar = $('#loadBar'), pct = $('#loadPct'), txt = $('#loadTxt');
  const STEP_MS = 40, SPEED = 26;          // 26% в секунду
  let value = 0, hung = false, paused = false;

  function label(v){
    // подпись = текст последнего пройденного порога
    let t = '';
    for (const [p, s] of LOADING_STEPS) if (v >= p) t = s;
    return t;
  }

  const timer = setInterval(() => {
    if (!paused){
      value = Math.min(100, value + SPEED * STEP_MS / 1000);
      if (value >= 99 && !hung){
        value = 99; hung = true; paused = true;
        setTimeout(() => { paused = false; }, 2000);   // «зависание» на 99%
      }
    }
    bar.style.width = value + '%';
    pct.textContent = Math.floor(value) + '%';
    txt.textContent = label(Math.floor(value));
    if (value >= 100){
      clearInterval(timer);
      $('#btnLoadNext').hidden = false;
    }
  }, STEP_MS);
};

function daysAlive(){
  const from = new Date(CONFIG.BIRTH_DATE + 'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((today - from) / 86400000));
}

// Плавный счётчик 0 → target
function countTo(el, target, dur, done){
  const STEP = 32;
  let t = 0;
  const timer = setInterval(() => {
    t += STEP;
    const p = Math.max(0, Math.min(1, t / dur));
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString('ru-RU');
    if (p >= 1){ clearInterval(timer); if (done) done(); }
  }, STEP);
}

// Счётчик, который долго крутится в больших числах и останавливается на target
function spinTo(el, target, dur, done){
  const STEP = 55;
  let t = 0;
  const timer = setInterval(() => {
    t += STEP;
    const p = Math.max(0, Math.min(1, t / dur));
    if (p < .8){
      const scale = 9000000 * (1 - p / .8) + 300;
      el.textContent = Math.floor(rand(1, scale)).toLocaleString('ru-RU');
    } else if (p < 1){
      el.textContent = String(Math.floor(rand(1, 40)));   // притормаживает на маленьких числах
    } else {
      el.textContent = String(target);
      clearInterval(timer);
      if (done) done();
    }
  }, STEP);
}

// Печать текста по символам
async function typeInto(el, text, speed){
  el.classList.add('caret');
  for (let i = 0; i < text.length; i++){
    el.textContent += text[i];
    await sleep(speed);
  }
  el.classList.remove('caret');
}

    await sleep(600);
  }
  await sleep(400);
  $('#btnTrackNext').hidden = false;
};
$('#btnTrackNext').addEventListener('click', () => go(12));

onEnter[13] = function(){
  const target = new Date(CONFIG.GIFT_DATE).getTime();
  const pad = n => String(n).padStart(2, '0');
  function tick(){
    const diff = target - Date.now();
    if (diff <= 0){
      $('#countdown').hidden = true;
      $('#s13-title').textContent = T.s13_over;
      $('#cdSub').hidden = true;
      return;
    }
    const s = Math.floor(diff / 1000);
    $('#cdD').textContent = pad(Math.floor(s / 86400));
    $('#cdH').textContent = pad(Math.floor(s / 3600) % 24);
    $('#cdM').textContent = pad(Math.floor(s / 60) % 60);
    $('#cdS').textContent = pad(s % 60);
    setTimeout(tick, 1000 - (Date.now() % 1000));
  }
  tick();
};

(function screen14(){
  // Рисуем сертификат на canvas вручную — без внешних библиотек
  function drawCertificate(){
    const W = 760, H = 1040, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');

    // фон «бумаги»
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f6e8d2');
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    // лёгкая «фактура»
    x.globalAlpha = .05; x.fillStyle = '#a0785a';
    for (let yy = 0; yy < H; yy += 4) x.fillRect(0, yy, W, 2);
    x.globalAlpha = 1;

    // рамки
    x.strokeStyle = 'rgba(190,140,90,.75)'; x.lineWidth = 4;
    x.strokeRect(34, 34, W - 68, H - 68);
    x.strokeStyle = 'rgba(190,140,90,.45)'; x.lineWidth = 2;
    x.strokeRect(50, 50, W - 100, H - 100);

    // заголовок
    x.textAlign = 'center'; x.fillStyle = '#8a5a2b';
    x.font = '700 40px Comfortaa, Trebuchet MS, sans-serif';
    x.fillText(T.s14_title, W / 2, 170);
    x.strokeStyle = 'rgba(190,140,90,.5)'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(150, 205); x.lineTo(W - 150, 205); x.stroke();

    // строки
    let y = 300;
    T.s14_rows.forEach(([k, v]) => {
      x.textAlign = 'left';  x.fillStyle = '#9c7a55';
      x.font = '400 24px Nunito, sans-serif';
      x.fillText(k, 100, y);
      x.textAlign = 'right'; x.fillStyle = '#5a4433';
      x.font = '700 26px Nunito, sans-serif';
      x.fillText(String(v), W - 100, y);
      x.strokeStyle = 'rgba(160,120,90,.35)'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(100, y + 18); x.lineTo(W - 100, y + 18); x.stroke();
      y += 78;
    });

    // печать
    x.save();
    x.translate(W - 240, H - 300); x.rotate(-16 * Math.PI / 180);
    x.strokeStyle = 'rgba(170,45,65,.55)'; x.lineWidth = 6;
    x.beginPath(); x.arc(0, 0, 108, 0, Math.PI * 2); x.stroke();
    x.lineWidth = 3;
    x.beginPath(); x.arc(0, 0, 94, 0, Math.PI * 2); x.stroke();
    x.fillStyle = 'rgba(170,45,65,.62)'; x.textAlign = 'center';
    x.font = '700 21px Comfortaa, Trebuchet MS, sans-serif';
    x.fillText(T.s14_seal[0], 0, -6);
    x.fillText(T.s14_seal[1], 0, 26);
    x.restore();

    // подпись внизу
    x.textAlign = 'center'; x.fillStyle = '#9c7a55';
    x.font = '400 24px Nunito, sans-serif';
    x.fillText(T.s14_foot.toUpperCase(), W / 2, H - 110);

    return c;
  }

  $('#btnSaveCert').addEventListener('click', async () => {
    const note = $('#saveNote');
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = drawCertificate();
      const url = canvas.toDataURL('image/png');
      if (!url || url.length < 1000) throw new Error('empty');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sertifikat-' + CONFIG.ORDER_NUMBER + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      note.textContent = T.s14_save_ok;
    } catch (err){
      note.textContent = T.s14_save_fail;   // работоспособность важнее
    }
  });

  $('#btnCertNext').addEventListener('click', () => go(15));
})();

   ========================================================================= */

};

(function confettiSetup(){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  let parts = [], raf = null, stopAt = 0;

  function resize(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
                     ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener('resize', resize);

  const COLORS = ['#e2705c','#f6c445','#7fd1a5','#8ab6f0','#f39ec0','#fff3d6'];

  function burst(n){
    for (let i = 0; i < n; i++){
      parts.push({
        x: rand(0, innerWidth), y: rand(-innerHeight * .4, 0),
        w: rand(6, 12), h: rand(9, 18),
        vx: rand(-40, 40), vy: rand(90, 240),
        rot: rand(0, 6.28), vr: rand(-6, 6),
        c: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
  }

  function frame(now){
    const dt = 1 / 60;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    parts = parts.filter(p => p.y < innerHeight + 40);
    if (Date.now() < stopAt || parts.length){
      if (Date.now() < stopAt && Math.random() < .35) burst(6);
      raf = requestAnimationFrame(frame);
    } else {
      cv.classList.remove('on'); ctx.clearRect(0, 0, innerWidth, innerHeight); raf = null;
    }
  }

  $('#btnThanks').addEventListener('click', () => {
    $('#btnThanks').hidden = true;
    // абзацы уходят, на экране остаётся только поздравление
    $('#finalText').classList.add('gone');
    setTimeout(() => { $('#finalText').hidden = true; }, 600);
    $('#finalBig').classList.add('show');
    resize(); cv.classList.add('on');
    stopAt = Date.now() + 5000;           // конфетти на 5 секунд
    burst(140);
    if (!raf) raf = requestAnimationFrame(frame);
  });
})();

/* =========================================================================
   СТАРТ
   ========================================================================= */
go(1);

})();
</script>
